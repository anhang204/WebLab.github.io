<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Nguyen Xuan An</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <a href="index.html" class="logo">XUAN AN</a>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="skills.html">Skills</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-section">
        <div class="container">
            <h2 class="section-title">Contact Me</h2>
            <form action="#" method="POST" class="contact-form">
                <div class="form-group">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <div class="form-group">
                    <label>Purpose of Contact:</label>
                    <div class="radio-group">
                        <div>
                            <input type="radio" id="enquiry" name="purpose" value="enquiry" checked>
                            <label for="enquiry">General Inquiry</label>
                        </div>
                        <div>
                            <input type="radio" id="collaboration" name="purpose" value="collaboration">
                            <label for="collaboration">Project Collaboration</label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Services you're interested in:</label>
                    <div class="checkbox-group">
                        <div>
                            <input type="checkbox" id="web" name="interest" value="web">
                            <label for="web">Web Development</label>
                        </div>
                        <div>
                            <input type="checkbox" id="mobile" name="interest" value="mobile">
                            <label for="mobile">Mobile Development</label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="source">How did you hear about me?</label>
                    <select id="source" name="source">
                        <option value="friends">From a friend</option>
                        <option value="social">Social Media</option>
                        <option value="github">GitHub</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                
                <button type="submit" class="btn">Send Message</button>
            </form>
        </div>
    </main>

    <footer class="main-footer">
        <p>© 2025 Nguyen Xuan An. All Rights Reserved.</p>
    </footer>
</body>
</html>
